name: Monitor Doerkson Intel
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/monitor_doerkson.py
      - run: |
          git config user.name "intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/04_cariboo_chilcotin/doerkson-live-monitor.md
          git diff --cached --quiet || (git commit -m "Auto-update Doerkson intel" && git push)
